[project]
name = "perufindocs-python"
version = "0.1.0"
description = "Python components for PeruFinDocs: ingestion pipelines and eval harness."
requires-python = ">=3.11"
dependencies = [
    # PDF parsing (final choice pending Week 1 eval)
    "docling>=2.0.0",
    "unstructured[pdf]>=0.15.0",
    "pypdf>=4.0.0",
    # Embeddings & reranking
    "sentence-transformers>=3.0.0",
    "FlagEmbedding>=1.2.0",
    # Data & infra
    "supabase>=2.5.0",
    "pgvector>=0.3.0",
    "redis>=5.0.0",
    "pydantic>=2.8.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    # LLM clients
    "anthropic>=0.34.0",
    "openai>=1.40.0",
    "together>=1.2.0",
    # Observability
    "langfuse>=2.40.0",
    # CLI & ops
    "typer>=0.12.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "black>=24.8.0",
    "pyright>=1.1.380",
    "pre-commit>=3.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pyright]
include = ["packages/ingestion", "packages/evals"]
typeCheckingMode = "strict"
pythonVersion = "3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["packages/ingestion/tests", "packages/evals/tests"]
